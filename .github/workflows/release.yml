name: Release Binaries
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
        run: |
          go build -ldflags="-X main.Version=${{ github.ref_name }}" \
            -o vigil-${{ matrix.os }}-${{ matrix.arch }} \
            ./cmd/vigil
      
      - name: Create checksum
        run: sha256sum vigil-${{ matrix.os }}-${{ matrix.arch }} > vigil-${{ matrix.os }}-${{ matrix.arch }}.sha256
      
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            vigil-${{ matrix.os }}-${{ matrix.arch }}
            vigil-${{ matrix.os }}-${{ matrix.arch }}.sha256
